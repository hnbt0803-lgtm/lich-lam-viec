<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký ca • Lịch Làm Việc</title><style>:root{font-family:system-ui,sans-serif;color:#39294f;background:#f7f3fd}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#7853ae,#aa8bd5);color:white;padding:23px 16px}main{max-width:700px;margin:18px auto;padding:0 12px}.card{background:white;border:1px solid #e6ddf0;border-radius:16px;padding:20px;margin-bottom:15px}h1{margin:0;font-size:23px}p{font-size:13px}label{display:block;font-weight:600;font-size:13px;margin:12px 0 6px}input,select{font:inherit;width:100%;padding:12px;border:1px solid #dcd2eb;border-radius:9px}input[type=checkbox]{width:auto}button{font:inherit;background:#7954b2;color:white;border:0;border-radius:10px;padding:13px;width:100%;cursor:pointer}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #eee;padding:10px 5px;text-align:center}th:first-child{text-align:left}.note{color:#655a74}.ok{color:#19734c}.err{color:#b33333}</style></head><body><header><div style="max-width:700px;margin:auto"><h1>✦ Đăng ký lịch làm việc</h1><p>Dành cho nhân viên cửa hàng</p></div></header><main><section class="card"><p id="status">Đang kết nối Firebase…</p><label for="store">Cửa hàng</label><select id="store"><option>ĐXH</option><option>ĐS17</option><option>TVD</option><option>BDN ĐXH</option><option>MT</option></select><label for="name">Họ và tên đầy đủ</label><input id="name" placeholder="Nhập họ tên đúng trong danh sách nhân viên" autocomplete="name"><label for="week">Thứ hai đầu tuần đăng ký</label><input id="week" type="date"><p class="note">Chọn những ca có thể làm. Gửi lại sẽ tạo đơn mới; quản lý chỉ nhập đơn phù hợp.</p><table><thead><tr><th>Ngày</th><th>Sáng</th><th>Chiều</th><th>Tối</th></tr></thead><tbody id="shifts"></tbody></table><p><button id="send" disabled>Gửi đăng ký</button></p><p id="result" role="status"></p></section></main><script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyBblBkIsL1ztvhfx0Tt7nbkMO8B8CXh5Ck",
  authDomain: "lich-lam-viec-1b451.firebaseapp.com",
  projectId: "lich-lam-viec-1b451",
  storageBucket: "lich-lam-viec-1b451.firebasestorage.app",
  messagingSenderId: "656385531409",
  appId: "1:656385531409:web:74bdd06ec77bb443865bb0",
  measurementId: "G-EZ608RZW2D"
};
const $=id=>document.getElementById(id),days=['T2','T3','T4','T5','T6','T7','CN'];
$('shifts').innerHTML=days.map((day,d)=>`<tr><th>${day}</th>${[0,1,2].map(k=>`<td><input type="checkbox" data-d="${d}" data-k="${k}" aria-label="${day} ca ${k+1}"></td>`).join('')}</tr>`).join('');
let now=new Date(),offset=(now.getDay()+6)%7,monday=new Date(now.getFullYear(),now.getMonth(),now.getDate()-offset+7);$('week').value=[monday.getFullYear(),String(monday.getMonth()+1).padStart(2,'0'),String(monday.getDate()).padStart(2,'0')].join('-');
try{const app=await import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),au=await import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js'),fs=await import('https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js');const a=app.initializeApp(firebaseConfig),auth=au.getAuth(a),db=fs.getFirestore(a);await au.signInAnonymously(auth);$('status').textContent='☁ Đã kết nối Firebase';$('status').className='ok';$('send').disabled=false;$('send').onclick=async()=>{let name=$('name').value.trim().replace(/\s+/g,' '),store=$('store').value,week=$('week').value,shifts=[...document.querySelectorAll('input[type=checkbox]:checked')].map(e=>({d:Number(e.dataset.d),k:Number(e.dataset.k)}));if(name.length<3||name.length>100)return alert('Vui lòng nhập họ tên đầy đủ.');if(!week||new Date(week+'T12:00:00').getDay()!==1)return alert('Ngày đầu tuần phải là thứ hai.');if(!shifts.length)return alert('Hãy chọn ít nhất một ca.');$('send').disabled=true;$('result').textContent='Đang gửi…';try{await fs.addDoc(fs.collection(db,'shiftRequests'),{name,store,week,shifts,status:'pending',createdAt:fs.serverTimestamp(),submittedBy:auth.currentUser.uid});$('result').textContent='✓ Đã gửi lên Firebase! Quản lý sẽ nhập vào lịch tổng.';$('result').className='ok'}catch(e){$('result').textContent='Không gửi được: '+e.code+' '+e.message;$('result').className='err'}finally{$('send').disabled=false}}}catch(e){$('status').textContent='Lỗi kết nối: '+e.code+' '+e.message;$('status').className='err'}
</script></body></html>
